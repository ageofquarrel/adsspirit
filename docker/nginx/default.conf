server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 20m;

    # Docker's embedded DNS. Without this, nginx resolves the "app" upstream
    # once at startup and caches that IP forever — if the app container is
    # ever recreated (rebuild, restart), nginx keeps dialing the old IP and
    # every request 502s until nginx itself is restarted. Using a variable
    # for fastcgi_pass forces nginx to re-resolve through this resolver
    # (respecting its TTL) instead of caching the address indefinitely.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $app_upstream app:9000;
        fastcgi_pass $app_upstream;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
