; Overrides the base image's default pool (pm.max_children = 5), which is
; far too low even for light concurrent load on this container — load
; testing showed p50 latency jumping from ~10ms to ~250ms at just 50
; concurrent connections purely from workers queueing up, not from the
; application or the database.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
